<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Charlotte Research Map</title>
  <meta name="color-scheme" content="light dark" />
</head>
<body>
  <div id="map" aria-label="Map of Charlotte transit and saved homes"></div>

  <aside class="panel" id="panel">
    <button class="grabber" id="grabber" aria-label="Expand panel"></button>
    <header class="panel-head">
      <div>
        <p class="eyebrow">Charlotte, NC</p>
        <h1>Research Map</h1>
      </div>
      <button class="icon-btn" id="theme" aria-label="Toggle appearance" title="Appearance">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 0 18V3z"/><circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </header>

    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="builders" aria-selected="true">Builders</button>
      <button role="tab" data-tab="commute" aria-selected="false">Commute</button>
      <button role="tab" data-tab="layers" aria-selected="false">Layers</button>
    </nav>

    <section class="view" id="view-builders"></section>
    <section class="view" id="view-commute" hidden></section>
    <section class="view" id="view-layers" hidden>
      <div class="toggles" id="toggles"></div>
    </section>

    <footer class="source" id="source"></footer>
  </aside>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
